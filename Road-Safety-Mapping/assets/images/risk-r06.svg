<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#1e293b"/>
  <!-- Service Alley -->
  <rect y="100" width="600" height="300" fill="#334155"/>
  <!-- Kindergarten Gate Boundary -->
  <rect y="0" width="600" height="100" fill="#475569"/>
  <rect x="350" y="20" width="160" height="80" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
  <text x="430" y="55" fill="#fef08a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">KG DISPERSAL GATE</text>

  <!-- Reversing Delivery Truck -->
  <g transform="translate(100, 160)">
    <!-- Truck Cabin -->
    <rect x="0" y="0" width="80" height="90" rx="4" fill="#0369a1"/>
    <!-- Cargo Box -->
    <rect x="80" y="-20" width="160" height="110" rx="4" fill="#0284c7" stroke="#e0f2fe" stroke-width="2"/>
    <text x="160" y="45" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DELIVERY / WASTE</text>
    <!-- Wheels -->
    <circle cx="45" cy="95" r="16" fill="#020617"/>
    <circle cx="190" cy="95" r="16" fill="#020617"/>
    <circle cx="215" cy="95" r="16" fill="#020617"/>
    <!-- Reverse Light and blind zone rays -->
    <polygon points="240,15 380,-10 380,100 240,65" fill="#ef4444" opacity="0.3"/>
    <text x="310" y="50" fill="#fee2e2" font-family="sans-serif" font-size="11" font-weight="bold">BLIND SPOT ZONE</text>
  </g>

  <!-- Young Child & Parent walking in lane -->
  <g transform="translate(420, 200)">
    <!-- Parent -->
    <circle cx="0" cy="0" r="7" fill="#cbd5e1"/>
    <line x1="0" y1="7" x2="0" y2="35" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="0" y1="35" x2="-8" y2="55" stroke="#cbd5e1" stroke-width="3.5"/>
    <line x1="0" y1="35" x2="8" y2="55" stroke="#cbd5e1" stroke-width="3.5"/>
    <!-- Holding Hands -->
    <line x1="0" y1="20" x2="25" y2="35" stroke="#cbd5e1" stroke-width="2.5"/>
    <!-- Child -->
    <circle cx="30" cy="20" r="5" fill="#38bdf8"/>
    <line x1="30" y1="25" x2="30" y2="45" stroke="#38bdf8" stroke-width="3"/>
    <line x1="30" y1="45" x2="24" y2="60" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="30" y1="45" x2="36" y2="60" stroke="#38bdf8" stroke-width="2.5"/>
  </g>

  <!-- Tag -->
  <rect x="20" y="20" width="220" height="34" rx="6" fill="#d97706"/>
  <text x="130" y="42" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">R06: MEDIUM RISK (SERVICE)</text>

  <!-- Field Log -->
  <rect x="20" y="340" width="560" height="42" rx="6" fill="#0f172a" opacity="0.9" stroke="#d97706" stroke-width="1.5"/>
  <text x="35" y="358" fill="#fde68a" font-family="sans-serif" font-size="10" font-weight="bold">FIELD OBSERVATION:</text>
  <text x="35" y="372" fill="#f1f5f9" font-family="sans-serif" font-size="10">Truck reversing with zero spotters directly into KG departure path at 12:15 PM.</text>
</svg>
