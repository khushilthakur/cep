<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#skyGrad)"/>
  
  <!-- Map Grid Overlay -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="650" y1="0" x2="650" y2="500" />
    <line x1="750" y1="0" x2="750" y2="500" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Stylized Road Network -->
  <path d="M 0 350 Q 200 340, 400 370 T 800 320" fill="none" stroke="#475569" stroke-width="70" stroke-linecap="round"/>
  <path d="M 0 350 Q 200 340, 400 370 T 800 320" fill="none" stroke="#64748b" stroke-width="60" stroke-linecap="round"/>
  <!-- Road Dash markings -->
  <path d="M 0 350 Q 200 340, 400 370 T 800 320" fill="none" stroke="#f1f5f9" stroke-width="4" stroke-dasharray="25, 20" opacity="0.8"/>

  <!-- Crossing Road -->
  <path d="M 380 120 L 410 480" stroke="#475569" stroke-width="50" stroke-linecap="round"/>
  <path d="M 380 120 L 410 480" stroke="#64748b" stroke-width="42" stroke-linecap="round"/>
  
  <!-- Zebra Crossing -->
  <g transform="translate(345, 335) rotate(15)">
    <rect x="0" y="0" width="10" height="40" fill="#ffffff" rx="2"/>
    <rect x="18" y="0" width="10" height="40" fill="#ffffff" rx="2"/>
    <rect x="36" y="0" width="10" height="40" fill="#ffffff" rx="2"/>
    <rect x="54" y="0" width="10" height="40" fill="#ffffff" rx="2"/>
    <rect x="72" y="0" width="10" height="40" fill="#ffffff" rx="2"/>
    <rect x="90" y="0" width="10" height="40" fill="#ffffff" rx="2"/>
  </g>

  <!-- School Building Isometric Model -->
  <g transform="translate(180, 100)">
    <!-- Main base -->
    <polygon points="120,40 220,90 100,150 0,100" fill="#1e3a8a" opacity="0.9"/>
    <!-- Left wall -->
    <polygon points="0,100 100,150 100,210 0,160" fill="#1d4ed8"/>
    <!-- Right wall -->
    <polygon points="100,150 220,90 220,150 100,210" fill="#2563eb"/>
    <!-- Windows Left -->
    <polygon points="15,115 35,125 35,140 15,130" fill="#93c5fd"/>
    <polygon points="45,130 65,140 65,155 45,145" fill="#93c5fd"/>
    <polygon points="75,145 95,155 95,170 75,160" fill="#93c5fd"/>
    <!-- Windows Right -->
    <polygon points="115,155 140,142 140,157 115,170" fill="#93c5fd"/>
    <polygon points="150,137 175,125 175,140 150,152" fill="#93c5fd"/>
    <polygon points="185,120 205,110 205,125 185,135" fill="#93c5fd"/>
    <!-- School Clock Tower -->
    <polygon points="90,15 130,35 110,45 70,25" fill="#3b82f6"/>
    <polygon points="70,25 110,45 110,95 70,75" fill="#1d4ed8"/>
    <polygon points="110,45 130,35 130,85 110,95" fill="#2563eb"/>
    <!-- Flag -->
    <line x1="100" y1="15" x2="100" y2="-10" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="100,-10 120,-3 100,4" fill="#ef4444"/>
    <text x="100" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">ST. JUDE MODEL SCHOOL</text>
  </g>

  <!-- Digital Map Marker: School (Shield) -->
  <g transform="translate(300, 180)">
    <circle cx="0" cy="0" r="28" fill="#1e40af" opacity="0.3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="18" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/>
    <path d="M -7 -4 L 0 -10 L 7 -4 L 7 4 Q 7 8 0 11 Q -7 8 -7 4 Z" fill="#fbbf24"/>
    <circle cx="0" cy="2" r="2" fill="#1e3a8a"/>
  </g>

  <!-- Digital Map Marker: High Risk Pin R01 (Main Gate) -->
  <g transform="translate(340, 310)">
    <!-- Radar pulse rings -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="18;36;18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="16" fill="#dc2626" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle">!</text>
    <!-- Card Callout -->
    <g transform="translate(25, -55)">
      <rect x="0" y="0" width="140" height="46" rx="8" fill="#0f172a" stroke="#dc2626" stroke-width="1.5" opacity="0.95"/>
      <text x="10" y="18" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="800">R01: HIGH RISK</text>
      <text x="10" y="34" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Main Gate Drop-off</text>
    </g>
  </g>

  <!-- Digital Map Marker: High Risk Pin R02 (SV Road Junction) -->
  <g transform="translate(560, 270)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="16;32;16" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">!</text>
    <!-- Card Callout -->
    <g transform="translate(22, -45)">
      <rect x="0" y="0" width="150" height="42" rx="6" fill="#0f172a" stroke="#dc2626" stroke-width="1.5" opacity="0.95"/>
      <text x="10" y="16" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="800">R02: HIGH RISK</text>
      <text x="10" y="32" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">SV Road Blind Turn</text>
    </g>
  </g>

  <!-- Digital Map Marker: Medium Risk Pin R03 -->
  <g transform="translate(480, 410)">
    <circle cx="0" cy="0" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5"/>
    <polygon points="0,-6 6,5 -6,5" fill="#ffffff"/>
    <circle cx="0" cy="3" r="1" fill="#78350f"/>
    <!-- Card Callout -->
    <g transform="translate(-160, -20)">
      <rect x="0" y="0" width="150" height="42" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>
      <text x="10" y="16" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="800">R03: MEDIUM RISK</text>
      <text x="10" y="32" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Encroached Sidewalk</text>
    </g>
  </g>

  <!-- Digital Map Marker: Low Risk Pin R05 -->
  <g transform="translate(140, 390)">
    <circle cx="0" cy="0" r="13" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M -4 0 L -1 3 L 5 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Vehicles -->
  <g transform="translate(240, 335)">
    <!-- Yellow School Bus -->
    <rect x="0" y="0" width="60" height="26" rx="5" fill="#f59e0b"/>
    <rect x="4" y="4" width="10" height="9" rx="1" fill="#1e293b"/>
    <rect x="18" y="4" width="10" height="9" rx="1" fill="#1e293b"/>
    <rect x="32" y="4" width="10" height="9" rx="1" fill="#1e293b"/>
    <rect x="46" y="4" width="10" height="9" rx="1" fill="#1e293b"/>
    <text x="30" y="21" fill="#0f172a" font-family="system-ui, sans-serif" font-size="7" font-weight="800" text-anchor="middle">SCHOOL BUS</text>
    <circle cx="12" cy="27" r="4" fill="#020617"/>
    <circle cx="48" cy="27" r="4" fill="#020617"/>
  </g>

  <!-- Pedestrians (Student silhouettes) -->
  <g transform="translate(365, 305)">
    <!-- Student with backpack -->
    <circle cx="0" cy="-22" r="4" fill="#38bdf8"/>
    <line x1="0" y1="-18" x2="0" y2="-6" stroke="#38bdf8" stroke-width="3"/>
    <line x1="0" y1="-6" x2="-4" y2="4" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="0" y1="-6" x2="4" y2="4" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Backpack -->
    <rect x="-6" y="-17" width="4" height="8" rx="1" fill="#f43f5e"/>
  </g>
  <g transform="translate(380, 308)">
    <circle cx="0" cy="-22" r="4" fill="#cbd5e1"/>
    <line x1="0" y1="-18" x2="0" y2="-6" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="0" y1="-6" x2="-3" y2="4" stroke="#cbd5e1" stroke-width="2.5"/>
    <line x1="0" y1="-6" x2="4" y2="4" stroke="#cbd5e1" stroke-width="2.5"/>
    <!-- Backpack -->
    <rect x="-6" y="-17" width="4" height="8" rx="1" fill="#fbbf24"/>
  </g>

  <!-- Top Badge Overlay -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="280" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <circle cx="18" cy="17" r="6" fill="#10b981"/>
    <text x="32" y="21" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">GIS ROAD SAFETY MAPPING PLATFORM</text>
  </g>
</svg>
