<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#1e293b"/>
  <!-- Road Surface -->
  <rect y="160" width="600" height="240" fill="#334155"/>
  <!-- Sidewalk Area -->
  <rect y="80" width="600" height="80" fill="#64748b"/>
  <!-- Kerb Line -->
  <line x1="0" y1="160" x2="600" y2="160" stroke="#94a3b8" stroke-width="4"/>

  <!-- Bus Shelter Structure -->
  <rect x="50" y="50" width="160" height="70" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="40" y="40" width="180" height="15" fill="#0284c7"/>
  <text x="130" y="85" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BEST BUS STOP</text>

  <!-- Encroachments / Stalls blocking footpath -->
  <g transform="translate(230, 70)">
    <rect width="90" height="70" fill="#b45309" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="0,0 45,-20 90,0" fill="#d97706"/>
    <text x="45" y="40" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">VENDOR STALL</text>
  </g>
  <g transform="translate(340, 95)">
    <!-- Broken Pavers / Rubble -->
    <polygon points="0,30 20,5 40,25 60,10 75,35" fill="#475569" stroke="#cbd5e1"/>
    <text x="40" y="55" fill="#fca5a5" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BROKEN PAVERS</text>
  </g>

  <!-- Forced Pedestrian Flow: Onto road -->
  <g transform="translate(440, 190)">
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
    <line x1="0" y1="6" x2="0" y2="24" stroke="#38bdf8" stroke-width="4"/>
    <line x1="0" y1="24" x2="-6" y2="38" stroke="#38bdf8" stroke-width="3"/>
    <line x1="0" y1="24" x2="6" y2="38" stroke="#38bdf8" stroke-width="3"/>
  </g>
  <g transform="translate(480, 205)">
    <circle cx="0" cy="0" r="6" fill="#f43f5e"/>
    <line x1="0" y1="6" x2="0" y2="24" stroke="#f43f5e" stroke-width="4"/>
    <line x1="0" y1="24" x2="-6" y2="38" stroke="#f43f5e" stroke-width="3"/>
    <line x1="0" y1="24" x2="6" y2="38" stroke="#f43f5e" stroke-width="3"/>
  </g>

  <!-- Approaching Bus -->
  <g transform="translate(50, 200)">
    <rect width="180" height="75" rx="8" fill="#dc2626"/>
    <rect x="15" y="10" width="30" height="25" rx="3" fill="#1e293b"/>
    <rect x="55" y="10" width="30" height="25" rx="3" fill="#1e293b"/>
    <rect x="95" y="10" width="30" height="25" rx="3" fill="#1e293b"/>
    <rect x="135" y="10" width="30" height="25" rx="3" fill="#1e293b"/>
    <text x="90" y="60" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CITY BUS</text>
    <circle cx="45" cy="75" r="14" fill="#020617"/>
    <circle cx="145" cy="75" r="14" fill="#020617"/>
  </g>

  <!-- Tag -->
  <rect x="20" y="20" width="200" height="34" rx="6" fill="#d97706"/>
  <text x="120" y="42" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">R03: MEDIUM RISK (FOOTPATH)</text>

  <!-- Field Log -->
  <rect x="20" y="340" width="560" height="42" rx="6" fill="#0f172a" opacity="0.9" stroke="#d97706" stroke-width="1.5"/>
  <text x="35" y="358" fill="#fde68a" font-family="sans-serif" font-size="10" font-weight="bold">FIELD OBSERVATION:</text>
  <text x="35" y="372" fill="#f1f5f9" font-family="sans-serif" font-size="10">Footpath width squeezed from 2.0m to 0.6m. 78% of students forced onto roadway.</text>
</svg>
