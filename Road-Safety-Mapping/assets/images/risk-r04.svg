<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#1e293b"/>
  <!-- Road Intersection -->
  <rect y="180" width="600" height="220" fill="#334155"/>
  <rect x="240" y="0" width="140" height="400" fill="#334155"/>

  <!-- Overgrown Foliage blocking streetlight and sightline -->
  <g transform="translate(100, 30)">
    <!-- Tree Trunk -->
    <rect x="70" y="100" width="20" height="90" fill="#78350f"/>
    <!-- Canopy -->
    <circle cx="80" cy="80" r="60" fill="#15803d" opacity="0.9"/>
    <circle cx="50" cy="90" r="45" fill="#166534" opacity="0.9"/>
    <circle cx="110" cy="70" r="50" fill="#14532d" opacity="0.9"/>
    <!-- Lamp Post underneath foliage -->
    <line x1="140" y1="180" x2="140" y2="70" stroke="#94a3b8" stroke-width="4"/>
    <path d="M 140 70 Q 155 60 170 70" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="170" cy="74" r="5" fill="#ca8a04"/>
    <!-- Dim light cone obscured -->
    <polygon points="170,79 130,180 210,180" fill="#fde047" opacity="0.15"/>
    <text x="140" y="50" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LAMP BLOCKED</text>
  </g>

  <!-- Missing Sign Indicator -->
  <g transform="translate(420, 110)">
    <line x1="30" y1="90" x2="30" y2="30" stroke="#94a3b8" stroke-width="4"/>
    <rect x="5" y="0" width="50" height="50" fill="#334155" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="30" y="25" fill="#f87171" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">?</text>
    <text x="30" y="40" fill="#fca5a5" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">NO SIGN</text>
  </g>

  <!-- Fast vehicle coming into intersection -->
  <g transform="translate(260, 240)">
    <rect width="90" height="50" rx="8" fill="#3b82f6"/>
    <rect x="20" y="8" width="50" height="24" rx="4" fill="#0f172a"/>
    <circle cx="25" cy="50" r="8" fill="#020617"/>
    <circle cx="75" cy="50" r="8" fill="#020617"/>
  </g>

  <!-- Tag -->
  <rect x="20" y="20" width="220" height="34" rx="6" fill="#d97706"/>
  <text x="130" y="42" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">R04: MEDIUM RISK (VISIBILITY)</text>

  <!-- Field Log -->
  <rect x="20" y="340" width="560" height="42" rx="6" fill="#0f172a" opacity="0.9" stroke="#d97706" stroke-width="1.5"/>
  <text x="35" y="358" fill="#fde68a" font-family="sans-serif" font-size="10" font-weight="bold">FIELD OBSERVATION:</text>
  <text x="35" y="372" fill="#f1f5f9" font-family="sans-serif" font-size="10">Overhanging canopy obscures light and sightlines. Zero 25 km/h school warning signs.</text>
</svg>
