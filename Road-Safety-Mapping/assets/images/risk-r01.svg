<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#1e293b"/>
  <!-- Road -->
  <rect y="220" width="600" height="180" fill="#334155"/>
  <!-- School Gate Wall -->
  <rect x="0" y="40" width="600" height="180" fill="#475569"/>
  <!-- Gate Structure -->
  <rect x="180" y="80" width="240" height="140" fill="#0f172a" stroke="#94a3b8" stroke-width="4"/>
  <line x1="220" y1="80" x2="220" y2="220" stroke="#64748b" stroke-width="3"/>
  <line x1="260" y1="80" x2="260" y2="220" stroke="#64748b" stroke-width="3"/>
  <line x1="300" y1="80" x2="300" y2="220" stroke="#f59e0b" stroke-width="4"/>
  <line x1="340" y1="80" x2="340" y2="220" stroke="#64748b" stroke-width="3"/>
  <line x1="380" y1="80" x2="380" y2="220" stroke="#64748b" stroke-width="3"/>
  <!-- School Signboard -->
  <rect x="190" y="30" width="220" height="45" rx="6" fill="#1e3a8a" stroke="#fbbf24" stroke-width="2"/>
  <text x="300" y="58" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ST. JUDE MODEL SCHOOL</text>

  <!-- Congested Vehicles at Gate -->
  <!-- Car 1 (Double Parked) -->
  <g transform="translate(60, 240)">
    <rect width="110" height="50" rx="8" fill="#ef4444" opacity="0.9"/>
    <rect x="25" y="6" width="60" height="24" rx="4" fill="#1e293b"/>
    <circle cx="25" cy="50" r="10" fill="#0f172a"/>
    <circle cx="85" cy="50" r="10" fill="#0f172a"/>
    <text x="55" y="42" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ILLEGAL PARK</text>
  </g>
  <!-- Auto Rickshaw 1 -->
  <g transform="translate(200, 270)">
    <path d="M 0 35 L 15 5 L 65 5 L 80 35 L 75 45 L 5 45 Z" fill="#eab308"/>
    <rect x="20" y="10" width="40" height="20" fill="#0f172a"/>
    <circle cx="20" cy="45" r="8" fill="#0f172a"/>
    <circle cx="65" cy="45" r="8" fill="#0f172a"/>
    <text x="40" y="24" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">AUTO</text>
  </g>
  <!-- Car 2 blocking sidewalk -->
  <g transform="translate(340, 235)">
    <rect width="120" height="52" rx="8" fill="#64748b"/>
    <rect x="30" y="8" width="60" height="24" rx="4" fill="#0f172a"/>
    <circle cx="30" cy="52" r="10" fill="#020617"/>
    <circle cx="95" cy="52" r="10" fill="#020617"/>
  </g>

  <!-- Students weaving between cars -->
  <g transform="translate(180, 210)">
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
    <line x1="0" y1="6" x2="0" y2="24" stroke="#38bdf8" stroke-width="4"/>
    <line x1="0" y1="24" x2="-6" y2="38" stroke="#38bdf8" stroke-width="3"/>
    <line x1="0" y1="24" x2="6" y2="38" stroke="#38bdf8" stroke-width="3"/>
  </g>
  <g transform="translate(315, 225)">
    <circle cx="0" cy="0" r="6" fill="#f43f5e"/>
    <line x1="0" y1="6" x2="0" y2="24" stroke="#f43f5e" stroke-width="4"/>
    <line x1="0" y1="24" x2="-5" y2="38" stroke="#f43f5e" stroke-width="3"/>
    <line x1="0" y1="24" x2="5" y2="38" stroke="#f43f5e" stroke-width="3"/>
  </g>

  <!-- High Risk Stamp & Warning -->
  <rect x="20" y="20" width="160" height="34" rx="6" fill="#dc2626"/>
  <text x="100" y="42" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">R01: HIGH RISK (GATE)</text>

  <!-- Field Log Box -->
  <rect x="20" y="340" width="560" height="42" rx="6" fill="#0f172a" opacity="0.9" stroke="#dc2626" stroke-width="1.5"/>
  <text x="35" y="358" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="bold">FIELD OBSERVATION:</text>
  <text x="35" y="372" fill="#f1f5f9" font-family="sans-serif" font-size="10">Severe pick-up crowding during 01:15 PM dispersal. Lack of physical drop-off bay.</text>
</svg>
