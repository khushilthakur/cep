<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#1e293b"/>
  <!-- Road -->
  <rect y="120" width="600" height="280" fill="#334155"/>
  <!-- Faded Zebra Stripes -->
  <g transform="translate(100, 150)">
    <!-- Weathered stripes -->
    <rect x="0" y="0" width="30" height="150" fill="#f8fafc" opacity="0.35"/>
    <rect x="60" y="0" width="30" height="150" fill="#f8fafc" opacity="0.25"/>
    <rect x="120" y="0" width="30" height="150" fill="#f8fafc" opacity="0.15"/>
    <rect x="180" y="0" width="30" height="150" fill="#f8fafc" opacity="0.3"/>
    <rect x="240" y="0" width="30" height="150" fill="#f8fafc" opacity="0.2"/>
    <rect x="300" y="0" width="30" height="150" fill="#f8fafc" opacity="0.1"/>
    <rect x="360" y="0" width="30" height="150" fill="#f8fafc" opacity="0.25"/>
  </g>
  <text x="300" y="235" fill="#f87171" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PAINT ERODED (>60% LOSS)</text>

  <!-- Approaching Cyclist -->
  <g transform="translate(70, 240)">
    <circle cx="20" cy="30" r="14" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="60" cy="30" r="14" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <line x1="20" y1="30" x2="40" y2="30" stroke="#38bdf8" stroke-width="2"/>
    <line x1="40" y1="30" x2="55" y2="15" stroke="#38bdf8" stroke-width="2"/>
    <line x1="20" y1="30" x2="35" y2="15" stroke="#38bdf8" stroke-width="2"/>
    <line x1="35" y1="15" x2="55" y2="15" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="38" cy="5" r="4" fill="#38bdf8"/>
    <line x1="38" y1="9" x2="40" y2="20" stroke="#38bdf8" stroke-width="2.5"/>
  </g>

  <!-- Tag -->
  <rect x="20" y="20" width="180" height="34" rx="6" fill="#16a34a"/>
  <text x="110" y="42" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">R05: LOW RISK (MARKING)</text>

  <!-- Field Log -->
  <rect x="20" y="340" width="560" height="42" rx="6" fill="#0f172a" opacity="0.9" stroke="#16a34a" stroke-width="1.5"/>
  <text x="35" y="358" fill="#86efac" font-family="sans-serif" font-size="10" font-weight="bold">FIELD OBSERVATION:</text>
  <text x="35" y="372" fill="#f1f5f9" font-family="sans-serif" font-size="10">Zebra marking has eroded >60%. Vehicles fail to yield due to poor stripe contrast.</text>
</svg>
